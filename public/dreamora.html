.btn.g{background:transparent;border:1px solid var(--line);box-shadow:none}

.hero{position:relative;min-height:88vh;display:flex;align-items:center;overflow:hidden}
#heroCv{position:absolute;inset:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,23,44,.92),rgba(16,23,44,.35) 60%,transparent);pointer-events:none}
.hero .in{position:relative;z-index:2;padding:48px 24px 48px max(24px,6vw);max-width:720px}
h1{font-size:clamp(2.6rem,7vw,5.6rem);line-height:.98;font-weight:800;margin:0 0 20px;letter-spacing:-.03em}
h2{font-size:1.9rem;margin:0 0 16px;letter-spacing:-.02em}
.sec{padding:56px max(24px,6vw);max-width:1200px;margin:auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.thumb{height:110px;border-radius:14px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--purple);border-color:var(--purple)}
.muted{opacity:.7}.tag{font-size:.8rem;padding:2px 10px;border-radius:99px;background:rgba(84,217,232,.18);color:var(--cyan)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:160px;resize:vertical}
.bar{height:6px;border-radius:9px;background:rgba(242,233,255,.12);overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .8s}
pre{background:rgba(0,0,0,.35);padding:12px;border-radius:12px;overflow:auto;font-size:.82rem}
.err{color:#ff9aa8}
#play{position:fixed;inset:0;z-index:50;background:#000;display:none}
#play.on{display:block}
#hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}

#dlg.on{display:flex}#dlg .card{background:var(--navy);max-width:360px}
footer{padding:32px;text-align:center;opacity:.6;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest("pre,script,style,textarea,[translate=no],.logo"))continue;const o=n._o||n.nodeValue.trim();if(o.length<2||!/[A-Za-z]/.test(o))continue;n._o=o;ns.push(n)}
const ph=[...root.querySelectorAll("[placeholder]")];ph.forEach(e=>{e.dataset.o=e.dataset.o||e.placeholder});
const apply=()=>{if(lg!==lang)return;ns.forEach(n=>{const t=m[n._o];if(t)n.nodeValue=n.nodeValue.replace(n.nodeValue.trim(),t)});ph.forEach(e=>{if(m[e.dataset.o])e.placeholder=m[e.dataset.o]})};
apply();const need=[...new Set([...ns.map(n=>n._o),...ph.map(e=>e.dataset.o)].filter(t=>!m[t]))];
for(let i=0;i<need.length;i+=15){const ch=need.slice(i,i+15);try{const r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:lg,texts:ch})});if(!r.ok){if(!xerr){xerr=1;const e=await r.json().catch(()=>({}));toast("Translation unavailable: "+(e.detail||e.error||r.status))}break}const d=await r.json();ch.forEach((t,j)=>{if(d.texts&&d.texts[j])m[t]=d.texts[j]});ls.set("dm:tc",TC);apply()}catch(e){break}}}
let xt;const ob=new MutationObserver(()=>{clearTimeout(xt);xt=setTimeout(()=>{["#app","#hud","#toast"].forEach(q=>xlate($(q)))},150)});["#app","#hud","#toast"].forEach(q=>ob.observe($(q),{childList:true,subtree:true}));
addEventListener("hashchange",route);init();route();
</script></body></html>
