async function diagAuth(url,key){const L=["Supabase URL: "+url];if(!/^https:\/\/[a-z0-9]+\.supabase\.co\/?$/.test(url))L.push("PROBLEM: the URL looks wrong. It must look like https://xxxx.supabase.co with nothing after .supabase.co (no / at the end, no /rest/v1).");try{const r=await fetch(url.replace(/\/+$/,"")+"/auth/v1/settings",{headers:{apikey:key}});if(!r.ok)L.push("PROBLEM: Supabase rejected the key (HTTP "+r.status+"). Use the publishable key (sb_publishable_...) from Project Settings, API Keys.");else{const j=await r.json();L.push("Key: OK");L.push("Google in Supabase: "+((j.external&&j.external.google)?"ON":"PROBLEM: OFF. Enable it in Authentication, Sign In / Providers, Google, then Save."))}}catch(e){L.push("PROBLEM: could not reach Supabase. Check SUPABASE_URL in Vercel.")}
L.push("Return address after login: "+location.origin+"/dreamora.html");L.push("In Supabase, Authentication, URL Configuration: Site URL must be "+location.origin+" and Redirect URLs must contain "+location.origin+"/**");const e=$("#wdiag");if(e){e.style.display="block";e.textContent=L.join("\n")}}
async function initAuth(){try{const r=await fetch("/api/config");const c=r.ok?await r.json():{};if(!c.url||!c.key||!window.supabase){if(/[?&]dev=1/.test(location.search))toast("The server sent no Supabase settings. Check SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in Vercel, then Redeploy.");return}if(/[?&]dev=1/.test(location.search))diagAuth(c.url,c.key);AUTH.sb=window.supabase.createClient(c.url,c.key,{auth:{flowType:"pkce",detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});AUTH.on=true;
$("#wbtn").onclick=async()=>{const x=await AUTH.sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/dreamora.html"}});if(x&&x.error)toast("Sign-in failed. Please try again.")};
const g=await AUTH.sb.auth.getSession();await authSet(g.data.session);AUTH.sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>authSet(sess),0)})}catch(e){}}

try{const pr=AI.interpret(t,{cat:st.cat,atmo:st.atmo,lang});for(let i=0;i<3;i++){await new Promise(r=>setTimeout(r,60));$("#b"+i).style.width="100%";await new Promise(r=>setTimeout(r,800))}st.plan=await pr;if((st.plan.objects||[]).some(o=>o.type==="custom")){const c=$("#out .card");c&&c.insertAdjacentHTML("beforeend",'<p class="muted">Designing your objects with AI…</p>');await AI.design(st.plan)}

catch(e){$("#out").innerHTML=e.limit?`<div class="card" style="margin-top:16px"><p>${esc(e.message)}</p><a class="btn" href="#plans">See plans</a></div>`:`<p class="err" role="alert">Generation failed: ${esc(e.message)}. Try again.</p>`}$("#gen").disabled=false;loadUsage()}}

$("#lang").innerHTML=Object.keys(L).map(k=>`<option value="${k}">${L[k][0]}</option>`).join("");$("#lang").value=lang;$("#lang").onchange=e=>setLang(e.target.value);
const TC=ls.get("dm:tc",{});let xerr=0;
async function xlate(root){if(lang==="en"||!root)return;const lg=lang,m=TC[lg]||(TC[lg]={}),ns=[];root.querySelectorAll("option:not([value])").forEach(o=>o.setAttribute("value",o.textContent));
const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest("pre,script,style,textarea,[translate=no],.logo"))continue;const o=n._o||n.nodeValue.trim();if(o.length<2||!/[A-Za-z]/.test(o))continue;n._o=o;ns.push(n)}
const ph=[...root.querySelectorAll("[placeholder]")];ph.forEach(e=>{e.dataset.o=e.dataset.o||e.placeholder});
const apply=()=>{if(lg!==lang)return;ns.forEach(n=>{const t=m[n._o];if(t)n.nodeValue=n.nodeValue.replace(n.nodeValue.trim(),t)});ph.forEach(e=>{if(m[e.dataset.o])e.placeholder=m[e.dataset.o]})};
apply();const need=[...new Set([...ns.map(n=>n._o),...ph.map(e=>e.dataset.o)].filter(t=>!m[t]))];
for(let i=0;i<need.length;i+=15){const ch=need.slice(i,i+15);try{const r=await fetch("/api/translate",{method:"POST",headers:HD(),body:JSON.stringify({lang:lg,texts:ch})});if(!r.ok){if(r.status!==401&&!xerr){xerr=1;const e=await r.json().catch(()=>({}));toast("Translation unavailable: "+(e.detail||e.error||r.status))}break}const d=await r.json();ch.forEach((t,j)=>{if(d.texts&&d.texts[j])m[t]=d.texts[j]});ls.set("dm:tc",TC);apply()}catch(e){break}}}
let xt;const ob=new MutationObserver(()=>{clearTimeout(xt);xt=setTimeout(()=>{["#app","#hud","#toast"].forEach(q=>xlate($(q)))},150)});["#app","#hud","#toast"].forEach(q=>ob.observe($(q),{childList:true,subtree:true}));
