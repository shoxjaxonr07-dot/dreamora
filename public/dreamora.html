.thumb{height:110px;border-radius:14px;margin-bottom:12px}

.err{color:#ff9aa8}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function toggleView(){view=view==="third"?"first":"third";hud()}
function hud(){$("#hud").innerHTML=`<button class="p" id="hx">✕ Exit</button><button class="p" id="hv">Camera: ${view==="third"?"Third":"First"}-person (V)</button><select class="p" id="hq" aria-label="Quality">${Object.keys(QS).map(q=>`<option ${q===qual?"selected":""}>${q}</option>`).join("")}</select><span class="p">WASD move · Shift run · Space jump · drag/click to look · V camera · Esc exit</span>`;
$("#hx").onclick=exitPlay;$("#hv").onclick=toggleView;$("#hq").onchange=e=>{qual=e.target.value;ls.set("dm:q",qual);applyQ();build(plan)}}
function enterPlay(p){if(!gl)return toast("WebGL is not available on this device.");if(p)build(p);mode="play";P.x=0;P.z=8;ground();P.vy=0;yaw=0;pitch=.35;$("#play").classList.add("on");mount($("#play"));hud();R.domElement.onclick=()=>{try{R.domElement.requestPointerLock()}catch(e){}}}
function exitPlay(){mode="preview";try{document.exitPointerLock()}catch(e){}$("#play").classList.remove("on");route()}
/* ---------- data ---------- */
const AV0={skin:"#e8b995",hair:"short",hairc:"#2b1b3a",outfit:"#8065ff",acc:"halo"};
const SAMPLES=[["Aurora Highlands","Nature","dawn",{trees:1,water:1,islands:0}],["Skyglass Citadel","Fantasy","twilight",{trees:.5,water:1,islands:1}],["Neon Meridian","Cities","midnight",{trees:.2,water:0,towers:1,islands:0}],["Lagoon House","Lifestyle","golden",{trees:.8,water:1,islands:0}],["Ember Ridge","Adventure","golden",{trees:.3,water:0,islands:0}],["Moonfall Orbit","Space","midnight",{trees:.1,water:0,islands:1}]].map((a,i)=>({id:"s"+i,name:a[0],cat:a[1],plan:{title:a[0],category:a[1],atmosphere:a[2],...a[3]}}));
const CATS=["Nature","Fantasy","Cities","Lifestyle","Adventure","Space"],PLANS=[["Free","$0","1 saved world, Low–High quality",1],["Dream Plus","$—","More saved worlds, priority queue",0],["Dream Pro","$—","Larger worlds, AI characters",0],["Dream Unlimited","$—","Unlimited worlds and sharing",0]];
let st={cat:"Nature",atmo:"auto",plan:null,f:"All",q:"",detail:null,pg:""};
const worlds=()=>ls.get("dm:worlds",[]);
function save(p,name){const w=worlds();w.unshift({id:Date.now().toString(36),name:name||p.title||"Untitled dream",plan:p,t:Date.now()});ls.set("dm:worlds",w);toast("Saved to My Worlds")}
/* ---------- pages ---------- */
const card=(w,extra="")=>`<div class="card"><div class="thumb" style="background:${grad(w.plan.atmosphere)}"></div><b>${esc(w.name)}</b> <span class="tag">${esc(w.cat||w.plan.category||"Custom")}</span><div class="row" style="margin-top:12px">${extra}</div></div>`;
const PG={
home:()=>`<section class="hero"><div id="heroCv"></div><div class="in"><h1>${esc(T("tag"))}</h1><p class="muted" style="max-width:48ch">Describe a place you have always imagined. DREAMORA turns it into a 3D world you can walk through. This preview runs a built-in demo world; AI generation connects once an API is configured.</p><div class="row"><a class="btn" href="#create">${T("cta")}</a><button class="btn g" id="demo">${T("enter")} (demo)</button></div></div></section>
<div class="sec"><h2>Featured worlds</h2><div class="grid">${SAMPLES.slice(0,3).map(w=>card(w,`<button class="btn g" data-e="${w.id}">${T("enter")}</button>`)).join("")}</div></div>
<div class="sec"><h2>How it works</h2><div class="grid"><div class="card"><b>1. Describe</b><p class="muted">Write your dream in your own words.</p></div><div class="card"><b>2. Interpret</b><p class="muted">The AI layer turns it into a structured world plan.</p></div><div class="card"><b>3. Enter</b><p class="muted">Walk, run and jump through the result.</p></div></div></div>
<div class="sec"><h2>Membership</h2><p class="muted">Free, Dream Plus, Dream Pro and Dream Unlimited. Payments are not enabled yet.</p><a class="btn g" href="#plans">${T("plans")}</a></div>`,
create:()=>`<div class="sec"><h2>${T("create")}</h2><p class="muted">Demo mode: no AI API is connected, so a built-in keyword reader builds the plan and the built-in demo terrain is used.</p>
<textarea id="txt" maxlength="2000" placeholder="A quiet lagoon house under floating islands at sunset…" aria-label="Dream description"></textarea><p class="err" id="err" role="alert"></p>
<div class="row" style="margin:12px 0">${CATS.map(c=>`<button class="chip ${c===st.cat?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
<div class="row"><label>Atmosphere <select id="atm">${["auto","dawn","twilight","midnight","golden"].map(a=>`<option ${a===st.atmo?"selected":""}>${a}</option>`).join("")}</select></label><button class="btn g" id="mic">Voice (not connected yet)</button><button class="btn" id="gen">${T("generate")}</button></div><div id="out"></div></div>`,
explore:()=>{const l=SAMPLES.filter(w=>(st.f==="All"||w.cat===st.f)&&w.name.toLowerCase().includes(st.q.toLowerCase()));if(st.detail){const w=SAMPLES.find(x=>x.id===st.detail);return `<div class="sec"><button class="btn g" id="back">← ${T("explore")}</button><h2 style="margin-top:16px">${esc(w.name)}</h2><div class="thumb" style="height:220px;background:${grad(w.plan.atmosphere)}"></div><p class="muted">${w.cat} · ${w.plan.atmosphere} atmosphere. This is a sample preset rendered on the demo terrain.</p><div class="row"><button class="btn" data-e="${w.id}">${T("enter")}</button><button class="btn g" data-s="${w.id}">${T("save")}</button></div></div>`}
return `<div class="sec"><h2>${T("explore")}</h2><div class="row"><input id="q" type="search" placeholder="Search worlds" value="${esc(st.q)}" aria-label="Search">${["All",...CATS].map(c=>`<button class="chip ${c===st.f?"on":""}" data-f="${c}">${c}</button>`).join("")}</div><div class="grid" style="margin-top:16px">${l.map(w=>card(w,`<button class="btn g" data-d="${w.id}">Details</button><button class="btn" data-e="${w.id}">${T("enter")}</button>`)).join("")||`<p class="muted">No worlds match. Clear the search or pick All.</p>`}</div></div>`},
worlds:()=>{const w=worlds();return `<div class="sec"><h2>${T("worlds")}</h2><div class="grid">${w.map(x=>card({...x,cat:x.plan.category},`<button class="btn" data-m="${x.id}">${T("enter")}</button><button class="btn g" data-r="${x.id}">Rename</button><button class="btn g" data-x="${x.id}">Delete</button>`)).join("")||`<div class="card"><p>No saved worlds yet.</p><a class="btn" href="#create">${T("cta")}</a></div>`}</div><p class="muted">Worlds are stored in this browser only until accounts and a database are connected.</p></div>`},
together:()=>`<div class="sec"><h2>${T("together")} <span class="tag">Not implemented yet</span></h2><p class="muted">Multiplayer needs a realtime server and accounts. Nothing here connects to other people yet.</p><div class="grid"><div class="card"><b>Friends</b><p class="muted">No friends list: sign-in is not configured.</p></div><div class="card"><b>Invitations</b><p class="muted">Invites will appear here.</p></div><div class="card"><b>Shared world</b><p class="muted">Planned for Phase 5.</p><button class="btn" disabled>Invite (unavailable)</button></div></div></div>`,
avatar:()=>{const c=ls.get("dm:avatar",AV0),o=(k,a)=>`<label>${k} <select data-a="${k}">${a.map(v=>`<option ${c[k]===v?"selected":""}>${v}</option>`).join("")}</select></label>`,cl=(k,l)=>`<label>${l} <input type="color" data-a="${k}" value="${c[k]}"></label>`;
return `<div class="sec"><h2>${T("avatar")}</h2><div class="row" style="align-items:flex-start"><svg id="avs" width="180" height="260" viewBox="0 0 180 260" aria-label="Avatar preview">${avsvg(c)}</svg><div class="card" style="display:grid;gap:12px">${cl("skin","Skin")}${o("hair",["short","long","bald"])}${cl("hairc","Hair colour")}${cl("outfit","Clothing")}${o("acc",["none","halo","glasses","crown"])}<button class="btn" id="sav">${T("save")}</button></div></div></div>`},
plans:()=>{const cur=ls.get("dm:prof",{name:"",plan:"Free"}).plan;return `<div class="sec"><h2>${T("plans")}</h2><p class="muted">Billing is not connected, so paid plans cannot be purchased yet.</p><div class="grid">${PLANS.map(p=>`<div class="card"><b>${p[0]}</b><p>${p[1]}</p><p class="muted">${p[2]}</p>${p[3]?`<button class="btn" data-p="${p[0]}" ${cur===p[0]?"disabled":""}>${cur===p[0]?"Current plan":"Choose"}</button>`:`<button class="btn g" data-w="${p[0]}">Join waitlist</button>`}</div>`).join("")}</div></div>`},
profile:()=>{const p=ls.get("dm:prof",{name:"",plan:"Free"});return `<div class="sec"><h2>${T("profile")}</h2><div class="card" style="display:grid;gap:12px;max-width:420px"><label>Display name<br><input id="nm" maxlength="40" value="${esc(p.name)}"></label><label>Language<br><select id="lg2">${Object.keys(L).map(k=>`<option value="${k}" ${k===lang?"selected":""}>${L[k][0]}</option>`).join("")}</select></label><p class="muted">Plan: ${esc(p.plan)} · Saved worlds: ${worlds().length}<br>Sign-in and account settings need Supabase Auth, which is not configured.</p><button class="btn" id="ps">${T("save")}</button></div></div>`}};
const avsvg=c=>`<rect x="55" y="110" width="70" height="120" rx="30" fill="${c.outfit}"/><circle cx="90" cy="75" r="38" fill="${c.skin}"/>${c.hair==="bald"?"":`<path d="M52 72a38 38 0 0 1 76 0z" fill="${c.hairc}"/>`}${c.hair==="long"?`<rect x="48" y="70" width="14" height="70" rx="7" fill="${c.hairc}"/><rect x="118" y="70" width="14" height="70" rx="7" fill="${c.hairc}"/>`:""}${c.acc==="halo"?`<ellipse cx="90" cy="26" rx="26" ry="7" fill="none" stroke="#54D9E8" stroke-width="4"/>`:c.acc==="glasses"?`<rect x="58" y="70" width="64" height="14" rx="6" fill="#111"/>`:c.acc==="crown"?`<path d="M64 40l8-22 18 14 18-14 8 22z" fill="#ffd24d"/>`:""}`;
/* ---------- router & events ---------- */
function route(){const h=(location.hash.slice(1)||"home");const k=PG[h]?h:"home";if(k!==st.pg){st.detail=null}st.pg=k;
$("#nav").innerHTML=Object.keys(PG).map(p=>`<a href="#${p}" class="${p===k?"on":""}">${T(p)}</a>`).join("");document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.documentElement.lang=lang;
$("#app").innerHTML=PG[k]()+`<footer>DREAMORA · Demo build. AI generation, accounts, payments and multiplayer are not connected.</footer>`;bind(k);scrollTo(0,0)}
function bind(k){const A=$("#app");A.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>enterPlay(SAMPLES.find(w=>w.id===b.dataset.e).plan));
if(k==="home"){mount($("#heroCv"));$("#demo").onclick=()=>enterPlay({atmosphere:"twilight",trees:1,water:true,islands:true});if(!gl)$("#heroCv").style.background=grad("twilight")}
if(k==="create"){A.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;A.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x===b))});$("#atm").onchange=e=>st.atmo=e.target.value;$("#mic").onclick=()=>toast("Voice input is not connected yet. Please type your dream.");
$("#gen").onclick=async()=>{const t=$("#txt").value.trim();$("#err").textContent="";if(t.length<10)return $("#err").textContent="Write at least 10 characters so there is something to interpret.";
$("#gen").disabled=true;const steps=["Reading your description","Building the world plan","Assembling the demo scene"];$("#out").innerHTML=`<div class="card" style="margin-top:16px"><p class="tag" style="display:inline-block">Demo mode: no AI API connected</p>${steps.map((s,i)=>`<div>${s}</div><div class="bar"><i id="b${i}"></i></div>`).join("")}</div>`;
try{const pr=AI.interpret(t,{cat:st.cat,atmo:st.atmo,lang});for(let i=0;i<3;i++){await new Promise(r=>setTimeout(r,60));$("#b"+i).style.width="100%";await new Promise(r=>setTimeout(r,800))}st.plan=await pr;
$("#out").innerHTML=`<div class="card" style="margin-top:16px"><b>${esc(st.plan.title)}</b> <span class="tag">${esc(st.plan.source)}</span><pre>${esc(JSON.stringify(st.plan,null,1))}</pre><p class="muted">This is a plan, not a generated 3D world. It adjusts the built-in demo terrain.</p><div class="row"><button class="btn" id="pe">${T("enter")}</button><button class="btn g" id="ps2">${T("save")}</button></div></div>`;$("#pe").onclick=()=>enterPlay(st.plan);$("#ps2").onclick=()=>save(st.plan)}
catch(e){$("#out").innerHTML=`<p class="err" role="alert">Generation failed: ${esc(e.message)}. Try again.</p>`}$("#gen").disabled=false}}
if(k==="explore"){const q=$("#q");q&&(q.oninput=e=>{st.q=e.target.value;const p=q.selectionStart;route();const n=$("#q");n.focus();n.setSelectionRange(p,p)});A.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{st.f=b.dataset.f;route()});A.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{st.detail=b.dataset.d;route()});const bk=$("#back");bk&&(bk.onclick=()=>{st.detail=null;route()});A.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const w=SAMPLES.find(x=>x.id===b.dataset.s);save(w.plan,w.name)})}
if(k==="worlds"){A.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>enterPlay(worlds().find(w=>w.id===b.dataset.m).plan));A.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>ask("Delete this world? This cannot be undone.",()=>{ls.set("dm:worlds",worlds().filter(w=>w.id!==b.dataset.x));toast("World deleted");route()}));
A.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const n=prompt("New name");if(n&&n.trim()){const w=worlds();w.find(x=>x.id===b.dataset.r).name=n.trim().slice(0,60);ls.set("dm:worlds",w);route()}})}
if(k==="avatar"){const c=ls.get("dm:avatar",AV0);A.querySelectorAll("[data-a]").forEach(i=>i.oninput=()=>{c[i.dataset.a]=i.value;$("#avs").innerHTML=avsvg(c)});$("#sav").onclick=()=>{ls.set("dm:avatar",c);if(av)setAvatar();toast("Avatar saved")}}
if(k==="plans"){A.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=ls.get("dm:prof",{name:"",plan:"Free"});p.plan=b.dataset.p;ls.set("dm:prof",p);toast("Free plan active");route()});A.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>toast("Waitlist is not connected yet. Paid plans are not available."))}
if(k==="profile"){$("#lg2").onchange=e=>setLang(e.target.value);$("#ps").onclick=()=>{const p=ls.get("dm:prof",{name:"",plan:"Free"});p.name=$("#nm").value.trim().slice(0,40);ls.set("dm:prof",p);toast("Profile saved")}}}
function setLang(l){lang=l;ls.set("dm:lang",l);$("#lang").value=l;route()}
$("#lang").innerHTML=Object.keys(L).map(k=>`<option value="${k}">${L[k][0]}</option>`).join("");$("#lang").value=lang;$("#lang").onchange=e=>setLang(e.target.value);
addEventListener("hashchange",route);init();route();
</script></body></html>
